name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: npx vitest run
        # No `|| true` and no raised heap: every test file must pass. The one file that used to die
        # with out-of-memory was an infinite render loop (see src/pages/BookWizard.jsx), not an infra issue.
      - name: Verify build
        run: npx vite build
