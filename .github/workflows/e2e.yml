name: E2E Tests
on:
  pull_request:
    branches: [main]

# Two groups of browser tests (see docs/E2E-SETUP.md):
#   public     - no account needed; runs on every pull request and must pass.
#   signed-in  - needs a Clerk test account. Without the repository secrets below these tests are
#                reported as SKIPPED with the reason in the log and in the job summary.
# Secrets do not reach pull requests from forks; the signed-in tests then skip, and say so.

jobs:
  e2e:
    # ubuntu-latest is Ubuntu 26.04. Playwright 1.58 could not install there; Playwright >= 1.61
    # supports it (release notes 1.61), so we upgraded instead of pinning an old image. If the image
    # moves ahead of Playwright again, the install step fails loudly (nothing is hidden by
    # continue-on-error any more).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional override of the (public) Clerk dev publishable key; default lives in e2e/clerk-key.js.
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build app (with the Clerk dev publishable key baked in)
        run: node scripts/e2e-build.mjs

      - name: Say which signed-in credentials are present
        run: |
          if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$E2E_CLERK_USER_EMAIL" ]; then
            echo "Signed-in E2E credentials present: signed-in tests will run."
          else
            echo "::warning title=Signed-in E2E tests will be SKIPPED::Repository secrets CLERK_SECRET_KEY and/or E2E_CLERK_USER_EMAIL are not set. Only the public tests run. See docs/E2E-SETUP.md."
          fi

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
