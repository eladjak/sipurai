name: E2E Tests
on:
  pull_request:
    branches: [main]

# E2E tests only run on PRs, not on every push to main.
# The app requires Clerk authentication which is not available in CI,
# so most E2E tests fail in CI without auth tokens.

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun x playwright install chromium --with-deps

      - name: Build app (verify it compiles)
        run: bun x vite build

      - name: Run E2E tests
        run: bun x playwright test
        continue-on-error: true
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
