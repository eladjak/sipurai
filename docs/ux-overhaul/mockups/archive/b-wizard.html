<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סיפוראי · כיוון ב · סיפור חדש, שלב 1</title>
<link rel="stylesheet" href="b.css">
<style>
.wiz{max-width:720px;margin-inline:auto;padding:0 var(--space) 150px}
.wtop{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.path{display:flex;align-items:center;gap:6px;list-style:none;padding:0}
.path li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.path .dot{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--edge);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;background:#fff;color:var(--ink)}
.path li.on .dot{background:var(--sun)} .path li.on{color:var(--ink);font-weight:700}
.path .ln{width:18px;height:3px;border-radius:3px;background:#D9D3E8}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.2;margin-top:14px}
.lead{color:var(--ink-2);font-size:16px;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 14px;text-align:center;position:relative}
.pick .face{width:80px;height:80px;border-radius:24px;border:2.5px solid var(--edge);display:grid;place-items:center;transform:rotate(-3deg)}
.pick:nth-child(even) .face{transform:rotate(3deg)}
.pick b{font-family:var(--font-display);font-weight:600;font-size:19px}
.pick small{font-size:13px;color:var(--ink-2)}
.pick[aria-checked="true"]{background:var(--violet-soft);outline:3px solid var(--violet);outline-offset:2px}
.pick .tick{position:absolute;top:-10px;inset-inline-start:-8px;width:32px;height:32px;border-radius:50%;background:var(--violet);color:#fff;border:2.5px solid var(--edge);display:grid;place-items:center}
.pick .tick svg{width:16px;height:16px}
.pick.new{border-style:dashed;box-shadow:none;background:transparent}
.pick.new .face{background:var(--sun-soft);transform:none}
.voice{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px}
.voice .mic{width:48px;height:48px;border-radius:50%;background:var(--coral);color:#fff;border:2.5px solid var(--edge);display:grid;place-items:center;flex:none}
.voice p{font-size:15px;line-height:1.4} .voice small{display:block;color:var(--ink-2);font-size:13px}
.foot{position:fixed;inset-inline:0;bottom:0;padding:16px var(--space) calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,rgba(255,249,238,0))}
.foot .in{max-width:684px;margin-inline:auto;display:flex;gap:10px}
.foot .btn{flex:1;min-height:58px;font-size:19px}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,1fr)} h1{font-size:38px}}
</style>
</head>
<body>
<div class="wiz">
  <header class="wtop">
    <ol class="path" aria-label="שלבים">
      <li class="on" aria-current="step"><span class="dot">1</span>גיבורים</li><li class="ln" aria-hidden="true"></li>
      <li><span class="dot">2</span>הרפתקה</li><li class="ln" aria-hidden="true"></li>
      <li><span class="dot">3</span>קסם</li>
    </ol>
    <button class="icon-btn" aria-label="לסגור ולחזור הביתה (הבחירות נשמרות)"><svg width="24" height="24"><use href="../icons.svg#i-close"/></svg></button>
  </header>
  <h1>מי יוצא להרפתקה?</h1>
  <p class="lead">בחרו גיבור אחד או כמה. אפשר גם להוסיף חדש.</p>
  <div class="grid" role="group" aria-label="גיבורי הסיפור">
    <button class="pick sticker" role="checkbox" aria-checked="true"><span class="tick" aria-hidden="true"><svg><use href="../icons.svg#i-check"/></svg></span>
      <span class="face" style="background:#FCD34D"><svg width="50" height="50" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="20" r="11" fill="#F7C9A8" stroke="#2A1E4A" stroke-width="1.6"/><path d="M11 18c1-8 21-9 22 0-4-4-17-4-22 0z" fill="#7A3E1D"/><circle cx="18" cy="21" r="1.4" fill="#2A1E4A"/><circle cx="26" cy="21" r="1.4" fill="#2A1E4A"/><path d="M18.5 25.5c2 1.6 5 1.6 7 0" stroke="#2A1E4A" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></span>
      <b>נועה</b><small>בת 5</small></button>
    <button class="pick sticker" role="checkbox" aria-checked="false">
      <span class="face" style="background:#FFE6E1"><svg width="50" height="50" viewBox="0 0 44 44" aria-hidden="true"><ellipse cx="22" cy="24" rx="11" ry="10" fill="#C08552" stroke="#2A1E4A" stroke-width="1.6"/><ellipse cx="12" cy="18" rx="4" ry="7" fill="#7A4A26"/><ellipse cx="32" cy="18" rx="4" ry="7" fill="#7A4A26"/><circle cx="18" cy="23" r="1.4" fill="#2A1E4A"/><circle cx="26" cy="23" r="1.4" fill="#2A1E4A"/><ellipse cx="22" cy="28" rx="2.4" ry="1.7" fill="#2A1E4A"/></svg></span>
      <b>בונבון</b><small>הכלב</small></button>
    <button class="pick sticker" role="checkbox" aria-checked="false">
      <span class="face" style="background:#DDF5EF"><svg width="50" height="50" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="20" r="11" fill="#EBB894" stroke="#2A1E4A" stroke-width="1.6"/><path d="M11 17c2-7 20-7 22 0-5-2-17-2-22 0z" fill="#2B2B2B"/><circle cx="18" cy="21" r="1.4" fill="#2A1E4A"/><circle cx="26" cy="21" r="1.4" fill="#2A1E4A"/><path d="M18.5 25.5c2 1.6 5 1.6 7 0" stroke="#2A1E4A" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></span>
      <b>אבא</b><small>גיבור משנה</small></button>
    <button class="pick sticker new"><span class="face"><svg width="30" height="30"><use href="../icons.svg#i-plus"/></svg></span><b>גיבור חדש</b><small>שם וגיל, וזהו</small></button>
  </div>
  <div class="voice sticker">
    <span class="mic" aria-hidden="true"><svg width="24" height="24"><use href="../icons.svg#i-mic"/></svg></span>
    <p>הילד רוצה לספר בעצמו?<small>לוחצים ומדברים. אנחנו כותבים, אתם מאשרים.</small></p>
  </div>
</div>
<div class="foot"><div class="in"><button class="btn btn-violet">יאללה, להרפתקה<svg><use href="../icons.svg#i-next"/></svg></button></div></div>
</body>
</html>
