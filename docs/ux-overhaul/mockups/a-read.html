<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סיפוראי · כיוון א · קריאה לפני השינה</title>
<link rel="stylesheet" href="a.css">
<style>
/* The child layer: night surface, no links out, no purchase, no sharing, no microphone, no open text. */
body{background:var(--night-900);color:var(--cream-100)}
.reader{min-height:100dvh;max-width:900px;margin-inline:auto;display:flex;flex-direction:column;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.exit{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);color:#D9CCF6;font-size:14px;position:relative}
.exit .ring{width:26px;height:26px}
.title{font-family:var(--font-display);font-weight:600;font-size:16px;color:#E6DCFA;text-align:center;flex:1}
.prog{display:flex;gap:5px;justify-content:center;margin:10px 0 12px}
.prog i{width:7px;height:7px;border-radius:50%;background:rgba(254,243,199,.25)} .prog i.done{background:var(--gold-300)} .prog i.now{background:var(--gold-400);width:22px;border-radius:99px}
.page{flex:1;display:flex;flex-direction:column;gap:16px}
.art{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(180deg,#2E1065 0%,#4C1D95 60%,#5B21B6 100%);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.text{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.65;color:var(--cream-100);padding:0 6px}
.text mark{background:rgba(252,211,77,.22);color:#fff;border-radius:6px;padding:0 3px;box-shadow:0 0 0 2px rgba(252,211,77,.35)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:14px}
.turn{min-height:72px;border-radius:22px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;color:#EDE4FF;transition:background .15s,transform .15s}
.turn:active{transform:scale(.97)} .turn:hover{background:rgba(255,255,255,.14)}
.turn svg{width:30px;height:30px}
.turn.next{background:var(--violet-600);color:#fff}
.turn.prev svg{transform:scaleX(-1)}
.play{width:84px;height:84px;border-radius:50%;background:var(--gold-400);color:var(--night-900);display:grid;place-items:center;box-shadow:0 8px 24px rgba(252,211,77,.35)}
.play svg{width:34px;height:34px}
.sub{display:flex;justify-content:center;gap:14px;margin-top:10px}
.sub button{min-height:44px;padding:0 14px;border-radius:var(--r-pill);color:#CDBEF0;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.sub button:hover{background:rgba(255,255,255,.08)}
@media (min-width:900px){.page{flex-direction:row;align-items:center}.art{flex:1.2}.text{flex:1;font-size:28px}}
</style>
</head>
<body>
<div class="reader">
  <header class="rtop">
    <button class="exit" aria-label="יציאה למבוגרים: להחזיק לחוץ שתי שניות">
      <svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="rgba(254,243,199,.25)" stroke-width="3"/><circle cx="13" cy="13" r="11" fill="none" stroke="#FCD34D" stroke-width="3" stroke-dasharray="69" stroke-dashoffset="46" transform="rotate(-90 13 13)" stroke-linecap="round"/></svg>
      להורים: להחזיק
    </button>
    <p class="title">נועה והירח שאיבד את האור</p>
    <span style="width:48px" aria-hidden="true"></span>
  </header>
  <div class="prog" role="img" aria-label="עמוד 6 מתוך 12"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <main class="page">
    <div class="art" role="img" aria-label="איור: נועה ובונבון על הגג, הירח חיוור מעליהם">
      <svg viewBox="0 0 400 300" aria-hidden="true">
        <g fill="#FEF3C7" opacity=".7"><circle cx="40" cy="40" r="1.6"/><circle cx="120" cy="24" r="1.2"/><circle cx="330" cy="60" r="1.8"/><circle cx="260" cy="30" r="1"/><circle cx="80" cy="110" r="1.1"/></g>
        <circle cx="290" cy="80" r="34" fill="#FDE38A" opacity=".45"/>
        <path d="M0 230 L120 170 L230 210 L400 160 V300 H0Z" fill="#1E0B3A"/>
        <rect x="60" y="200" width="120" height="70" fill="#2A1052"/><path d="M50 205 L120 165 L190 205Z" fill="#3B0764"/>
        <circle cx="105" cy="168" r="11" fill="#F7C9A8"/><path d="M94 166c1-9 21-10 22 0-5-4-17-4-22 0z" fill="#7A3E1D"/><path d="M92 196c2-12 8-16 13-16s11 4 13 16z" fill="#8B5CF6"/>
        <ellipse cx="140" cy="186" rx="10" ry="8" fill="#C08552"/><ellipse cx="132" cy="181" rx="3" ry="5" fill="#7A4A26"/><ellipse cx="148" cy="181" rx="3" ry="5" fill="#7A4A26"/>
      </svg>
    </div>
    <p class="text">נועה הרימה את הפנס הקטן אל השמיים. "ירח, אל תדאג", היא לחשה, <mark>ובונבון</mark> נבח פעם אחת, בשקט, כדי לא להעיר אף אחד.</p>
  </main>
  <div class="controls">
    <button class="turn prev" aria-label="לעמוד הקודם"><svg><use href="icons.svg#i-next"/></svg></button>
    <button class="play" aria-label="להשהות את ההקראה"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
    <button class="turn next" aria-label="לעמוד הבא"><svg><use href="icons.svg#i-next"/></svg></button>
  </div>
  <div class="sub">
    <button><svg width="18" height="18" aria-hidden="true"><use href="icons.svg#i-play"/></svg>להקריא שוב את העמוד</button>
  </div>
</div>
</body>
</html>
